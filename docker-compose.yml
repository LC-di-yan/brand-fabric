# 完整形态：PostgreSQL(数仓) + Milvus Standalone(向量库) + API
# 启动：docker compose up -d
# 首次启动 Milvus 约需 60-90 秒（etcd 选主 + 组件握手），healthcheck 未通过前请勿写数据
services:
  postgres:
    image: postgres:16-alpine
    container_name: bdp-postgres
    environment:
      POSTGRES_USER: bdp
      POSTGRES_PASSWORD: bdp_pass
      POSTGRES_DB: bdp
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdp -d bdp"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: bdp-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: bdp-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: bdp-milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  api:
    build: .
    container_name: bdp-api
    restart: unless-stopped
    environment:
      BDP_MODE: full
      BDP_DATABASE_URL: postgresql+psycopg://bdp:bdp_pass@postgres:5432/bdp
      BDP_VECTOR_BACKEND: milvus
      BDP_MILVUS_URI: http://milvus:19530
      BDP_EMBEDDING_BACKEND: hash
      # full 模式安全闸门：占位密钥会拒绝启动。可用环境变量覆盖为真实密钥：
      #   export BDP_JWT_SECRET="$(python -c "import secrets;print(secrets.token_urlsafe(48))")"
      # 下方默认值仅用于本机演示，不是密钥，不要用于任何真实部署。
      BDP_JWT_SECRET: "${BDP_JWT_SECRET:-compose-demo-placeholder-set-real-secret-via-env}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: bdp-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    container_name: bdp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: bdp_demo
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
